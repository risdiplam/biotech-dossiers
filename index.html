<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biotech Dossiers — Deep-Dive Research Library</title>
<style>
:root{--bg:#ffffff;--ink:#1a1d21;--muted:#5f6b76;--line:#e2e6ea;--wash:#f4f6f8;--accent:#0e7c6b;--radius:10px}
html[data-theme="dark"]{--bg:#121417;--ink:#e8eaed;--muted:#9aa4ae;--line:#2b3138;--wash:#1a1e22;--accent:#4fd1b5}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 60px}
header{text-align:center;margin:40px 0 32px}
header h1{margin:0 0 8px;font-size:32px}
header p{color:var(--muted);margin:0}
.controls{display:flex;gap:12px;margin:24px 0;flex-wrap:wrap}
.controls input{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);font-size:15px}
.theme-btn{padding:10px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--wash);color:var(--ink);cursor:pointer;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:var(--wash);text-decoration:none;color:inherit;display:block;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.card .ticker{font-size:22px;font-weight:800;color:var(--accent)}
.card .company{font-size:15px;margin:4px 0;color:var(--ink)}
.card .meta{font-size:13px;color:var(--muted);margin-top:8px}
.card .catalyst{font-size:13px;margin-top:6px;padding:6px 10px;background:var(--bg);border-radius:6px;border-left:3px solid var(--accent)}
.card .scenarios{font-size:12px;color:var(--muted);margin-top:6px;font-family:monospace}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
@media(max-width:600px){header h1{font-size:26px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Biotech Dossiers</h1>
<p>Deep-dive research library — 18 tickers, each with full science, pipeline, catalysts, and bear/base/bull scenarios.</p>
</header>
<div class="controls">
<input type="search" id="q" placeholder="Search tickers or companies…" aria-label="Search dossiers">
<button class="theme-btn" id="themeBtn" aria-label="Toggle theme">🌙</button>
</div>
<div class="grid" id="grid"></div>
<footer>
<p>Research as of October 2026. For educational purposes — not investment advice.<br>Scenario price ranges are illustrative, not predictions.</p>
</footer>
</div>
<script>
const D=[
{t:"PEPG",c:"PepGen",d:"2026-10-10",cat:"FREEDOM2 10mg/kg DM1 data — Nov 2026 [guidance]",sc:"Bear $0.75–1.25 / Base $3–4 / Bull $8–11"},
{t:"CRBP",c:"Corbus Pharmaceuticals",d:"2026-10-10",cat:"TEMPO-1 first patient dosed; ObesityWeek late-breaker Nov 14–17 [hard]",sc:"Bear $2.50 / Base $12 / Bull $30"},
{t:"SLGL",c:"Sol-Gel Technologies",d:"2026-10-10",cat:"SGT-610 Ph3 Gorlin topline — late Nov 2026 [guidance]; Nov 17 shareholder meeting",sc:"Bear $11–14 / Base $50–85 / Bull $150–197"},
{t:"LTGO",c:"Latigo Biotherapeutics",d:"2026-10-10",cat:"Onzotrigine Ph3 bunionectomy topline — 2H 2027 [guidance]",sc:"Bear $7.50 / Base $25 / Bull $73"},
{t:"HELP",c:"Helus Pharma",d:"2026-10-10",cat:"HLP003 APPROACH pivotal — Q4 2026 binary; Oct 21 presentation",sc:"Bear $2 / Base $18 / Bull $60–68"},
{t:"IRON",c:"Disc Medicine",d:"2026-10-10",cat:"Bitopertin NDA timeline",sc:"Bear $25–35 / Base $40–55 / Bull $95–153"},
{t:"IMUX",c:"Immunic Inc",d:"2026-10-10",cat:"Vidofludimus MS disability data",sc:"Bear $1 / Base $20 / Bull $50"},
{t:"SPRB",c:"Spruce Biosciences",d:"2026-10-10",cat:"TA-ERT BLA submission — Q4 2026 [guidance]",sc:"Bear $30 / Base $70 / Bull $120"},
{t:"HRMY",c:"Harmony Biosciences",d:"2026-10-10",cat:"Q3 earnings — early Nov 2026",sc:"Bear $31 / Base $45 / Bull $70"},
{t:"PRAX",c:"Praxis Precision Medicines",d:"2026-10-10",cat:"Vormatrigine pipeline readouts",sc:"Bear $105 / Base $295 / Bull $610"},
{t:"AXSM",c:"Axsome Therapeutics",d:"2026-10-10",cat:"AXS-05 / AXS-07 commercial execution",sc:"Bear $95 / Base $195 / Bull $235"},
{t:"XENE",c:"Xenon Pharmaceuticals",d:"2026-10-10",cat:"Azacitidine pipeline catalysts",sc:"Bear $22 / Base $68 / Bull $90"},
{t:"STOK",c:"Stoke Therapeutics",d:"2026-10-10",cat:"STK-001 regulatory updates",sc:"Bear $7 / Base $44 / Bull $60"},
{t:"OVID",c:"Ovid Therapeutics",d:"2026-10-10",cat:"OV101 pipeline progress",sc:"Bear $0.75 / Base $4 / Bull $8"},
{t:"GLUE",c:"Monte Rosa Therapeutics",d:"2026-10-10",cat:"MRT-6160 GFORCE-2 updates",sc:"Bear $6 / Base $12 / Bull $23"},
{t:"SLN",c:"Silence Therapeutics",d:"2026-10-10",cat:"Zerlasiran pipeline catalysts",sc:"Bear $3.50 / Base $19 / Bull $60"},
{t:"PHVS",c:"Pharvaris",d:"2026-10-10",cat:"Deucrictibant RAPIDe-3 follow-through",sc:"Bear $10 / Base $50 / Bull $75"},
{t:"NKTR",c:"Nektar Therapeutics",d:"2026-10-10",cat:"Rezpegaldesleukin pipeline readouts",sc:"Bear $11 / Base $105 / Bull $185"},
];
const grid=document.getElementById('grid'),q=document.getElementById('q');
function render(f=""){
f=f.toLowerCase();
grid.innerHTML=D.filter(x=>(x.t+x.c).toLowerCase().includes(f)).map(x=>
`<a class="card" href="${x.t}.html"><div class="ticker">${x.t}</div><div class="company">${x.c}</div><div class="meta">Updated ${x.d}</div><div class="catalyst">${x.cat}</div><div class="scenarios">${x.sc}</div></a>`).join('')
||'<p style="color:var(--muted)">No matches.</p>';
}
q.addEventListener('input',e=>render(e.target.value));
render();
// theme
const b=document.getElementById('themeBtn');
function setT(t){document.documentElement.dataset.theme=t;localStorage.setItem('biotech-theme',t);b.textContent=t==='dark'?'☀️':'🌙';}
setT(localStorage.getItem('biotech-theme')||'light');
b.onclick=()=>setT(document.documentElement.dataset.theme==='dark'?'light':'dark');
</script>
</body>
</html>
